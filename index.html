<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <meta name="description" content="Simple weather app showing current weather, hourly forecast for your location." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Weather App</h1>

    <div class="search-bar">
      <input
        type="text"
        id="locationInput"
        placeholder="Enter a city or location..."
        aria-label="Location input"
      />
      <button id="searchBtn" aria-label="Search weather">Search</button>
      <button id="refreshBtn" aria-label="Refresh weather">&#x21bb; Refresh</button>
    </div>

    <div id="error" class="error hidden"></div>
    <div id="loading" class="loading hidden">Loading...</div>

    <div id="weatherCard" class="weather-card hidden">
      <div class="current-weather">
        <h2 id="locationName"></h2>
        <p id="dateTime"></p>
        <div class="main-info">
          <span id="tempDisplay" class="temp"></span>
          <span id="conditionDisplay" class="condition"></span>
        </div>
        <div class="details">
          <div class="detail-item">
            <span class="label">Wind</span>
            <span id="windSpeed"></span>
          </div>
          <div class="detail-item">
            <span class="label">Rain Chance</span>
            <span id="rainChance"></span>
          </div>
          <div class="detail-item">
            <span class="label">Humidity</span>
            <span id="humidity"></span>
          </div>
          <div class="detail-item">
            <span class="label">Feels Like</span>
            <span id="feelsLike"></span>
          </div>
        </div>
      </div>

      <h3 class="hourly-title">24-Hour Forecast</h3>
      <div id="hourlyForecast" class="hourly-scroll"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
