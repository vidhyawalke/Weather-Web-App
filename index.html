---
layout: default
---

<!-- Set up the search bar with input, search, and refresh buttons -->
<div class="search-bar">
  <input
    type="text"
    id="locationInput"
    placeholder="Enter a city or location..."
    aria-label="Location input"
  />
  <button id="searchBtn" aria-label="Search weather">Search</button>
  <button id="refreshBtn" aria-label="Refresh weather">&#x21bb; Refresh</button>
</div>

<!-- Added error and loading state placeholders -->
<div id="error" class="error hidden"></div>
<div id="loading" class="loading hidden">Loading...</div>

<!-- Built the weather card that showed current conditions and hourly forecast -->
<div id="weatherCard" class="weather-card hidden">
  <div class="current-weather">
    <h2 id="locationName"></h2>
    <p id="dateTime"></p>
    <div class="main-info">
      <span id="tempDisplay" class="temp"></span>
      <span id="conditionDisplay" class="condition"></span>
    </div>
    <!-- Listed the detail items: wind, rain, humidity, feels like -->
    <div class="details">
      <div class="detail-item">
        <span class="label">Wind</span>
        <span id="windSpeed"></span>
      </div>
      <div class="detail-item">
        <span class="label">Rain Chance</span>
        <span id="rainChance"></span>
      </div>
      <div class="detail-item">
        <span class="label">Humidity</span>
        <span id="humidity"></span>
      </div>
      <div class="detail-item">
        <span class="label">Feels Like</span>
        <span id="feelsLike"></span>
      </div>
    </div>
  </div>

  <!-- Added the 24-hour horizontal forecast scroll section -->
  <h3 class="hourly-title">24-Hour Forecast</h3>
  <div id="hourlyForecast" class="hourly-scroll"></div>
</div>

<!-- Loaded the main app script -->
<script src="{{ '/app.js' | relative_url }}"></script>
